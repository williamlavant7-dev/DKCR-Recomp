<!-- The iOS app icon: icon.svg's art edge to edge (iOS rounds the corners and pads itself), no border, opaque.
     icon_ios_1024.png is this rendered by rsvg-convert. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="100 100 824 824">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a8c"/>
      <stop offset="0.45" stop-color="#d9607a"/>
      <stop offset="0.8" stop-color="#ffa64d"/>
      <stop offset="1" stop-color="#ffd98a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a9bb0"/>
      <stop offset="1" stop-color="#11506e"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dca0"/>
      <stop offset="1" stop-color="#d1a45a"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a3a4a"/>
      <stop offset="1" stop-color="#2c1d2e"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ff5a1f"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4520"/>
      <stop offset="0.35" stop-color="#c47a3a"/>
      <stop offset="0.65" stop-color="#b06a2e"/>
      <stop offset="1" stop-color="#6a3a1a"/>
    </linearGradient>
    <linearGradient id="hoop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d6570"/>
      <stop offset="0.4" stop-color="#b9c2cc"/>
      <stop offset="1" stop-color="#4a525c"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1b8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff1b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="craterglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf4d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff6a1f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g >
    <rect x="0" y="0" width="1024" height="1024" fill="url(#sky)"/>
    <!-- low sun -->
    <circle cx="300" cy="560" r="190" fill="url(#sunglow)"/>
    <circle cx="300" cy="560" r="95" fill="#fff1c2"/>
    <!-- smoke -->
    <g fill="#6b5560" opacity="0.85">
      <circle cx="690" cy="300" r="62"/>
      <circle cx="745" cy="235" r="74"/>
      <circle cx="820" cy="190" r="82"/>
      <circle cx="905" cy="170" r="90"/>
    </g>
    <g fill="#8a7078" opacity="0.7">
      <circle cx="720" cy="270" r="40"/>
      <circle cx="790" cy="215" r="48"/>
      <circle cx="870" cy="175" r="52"/>
    </g>
    <!-- volcano -->
    <circle cx="660" cy="360" r="120" fill="url(#craterglow)"/>
    <path d="M430 640 L610 372 Q660 352 712 372 L900 640 Z" fill="url(#rock)"/>
    <path d="M610 372 Q660 352 712 372 Q690 390 660 386 Q630 390 610 372 Z" fill="#ff8a2a"/>
    <path d="M640 384 Q628 450 600 500 Q590 540 560 585 Q600 545 622 500 Q648 450 656 386 Z" fill="url(#lava)"/>
    <path d="M684 384 Q700 440 732 470 Q752 500 770 540 Q745 505 720 480 Q690 450 676 386 Z" fill="url(#lava)"/>
    <!-- sea -->
    <rect x="0" y="620" width="1024" height="404" fill="url(#sea)"/>
    <path d="M60 660 Q190 640 320 660 T580 660 T840 660 T1100 660" fill="none" stroke="#7fd3df" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <path d="M40 712 Q170 694 300 712 T560 712 T820 712 T1080 712" fill="none" stroke="#5fb9c9" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <!-- beach -->
    <path d="M0 800 Q260 740 560 770 Q820 795 1024 760 L1024 1024 L0 1024 Z" fill="url(#sand)"/>
    <!-- palm tree -->
    <path d="M232 860 Q236 720 300 600 Q330 545 352 500" fill="none" stroke="#5a3a1e" stroke-width="30" stroke-linecap="round"/>
    <path d="M232 860 Q236 720 300 600 Q330 545 352 500" fill="none" stroke="#7d5330" stroke-width="12" stroke-dasharray="6 26" stroke-linecap="round"/>
    <g fill="#2f8f3a">
      <path d="M352 500 Q290 440 196 452 Q270 470 330 520 Z"/>
      <path d="M352 500 Q330 410 260 372 Q316 430 330 500 Z"/>
      <path d="M352 500 Q410 410 500 404 Q420 440 370 512 Z"/>
      <path d="M352 500 Q450 480 520 540 Q440 515 368 520 Z"/>
      <path d="M352 500 Q300 530 250 610 Q310 548 360 516 Z"/>
    </g>
    <g fill="#4fb84a">
      <path d="M352 500 Q300 452 226 458 Q290 474 336 512 Z"/>
      <path d="M352 500 Q412 424 480 416 Q420 448 368 506 Z"/>
    </g>
    <circle cx="346" cy="512" r="14" fill="#6b4a22"/>
    <circle cx="364" cy="518" r="13" fill="#5a3d1c"/>
    <!-- barrel -->
    <ellipse cx="640" cy="905" rx="150" ry="22" fill="#000" opacity="0.18"/>
    <path d="M520 640 Q505 760 520 880 Q640 905 760 880 Q775 760 760 640 Q640 615 520 640 Z" fill="url(#wood)"/>
    <g stroke="#5a3016" stroke-width="5" opacity="0.7" fill="none">
      <path d="M580 630 Q570 760 580 892"/>
      <path d="M640 625 Q640 760 640 898"/>
      <path d="M700 630 Q710 760 700 892"/>
    </g>
    <path d="M516 690 Q640 712 764 690 L766 718 Q640 740 514 718 Z" fill="url(#hoop)"/>
    <path d="M516 800 Q640 822 764 800 L766 828 Q640 850 514 828 Z" fill="url(#hoop)"/>
    <ellipse cx="640" cy="638" rx="120" ry="22" fill="#8a5126"/>
    <ellipse cx="640" cy="638" rx="100" ry="15" fill="#a8652f"/>
    <!-- bananas on the barrel -->
    <g stroke="#7a5a10" stroke-width="4">
      <path d="M590 628 Q600 560 670 548 Q620 575 612 630 Z" fill="#ffd93b"/>
      <path d="M612 630 Q640 568 712 566 Q655 590 636 632 Z" fill="#ffe25a"/>
      <path d="M636 632 Q680 590 742 600 Q684 610 660 634 Z" fill="#ffd12a"/>
    </g>
    <path d="M664 548 L684 538 L690 552 L672 558 Z" fill="#5a3d10"/>
  </g>
</svg>
